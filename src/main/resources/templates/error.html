<!DOCTYPE html>
<!-- Halaman error bawaan Spring Boot (/error) untuk error di luar controller, mis. dari filter. -->
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head th:replace="~{fragments/layout :: head(${status == 404} ? 'Halaman tidak ditemukan' : (${status == 403} ? 'Akses ditolak' : 'Terjadi kesalahan'))}"></head>
<body>
<svg th:replace="~{fragments/layout :: sprite}"></svg>
<div class="shell">
    <header th:replace="~{fragments/layout :: pubbar('lain')}"></header>
    <main class="card pesan-box" th:with="s=${status != null ? status : 500}">
        <span class="kode-status" th:text="${s}">500</span>
        <span class="chip-icon pesan-ikon"><svg class="i i-lg"><use href="#i-alert"/></svg></span>
        <h2 th:text="${s == 404} ? 'Halaman tidak ditemukan' : (${s == 403} ? 'Akses ditolak' : (${s >= 500} ? 'Terjadi kesalahan' : 'Permintaan tidak dapat diproses'))">Judul</h2>
        <p class="muted" style="margin:8px 0 20px"
           th:text="${s == 404} ? 'Alamat yang Anda buka tidak ada.' : (${s == 403} ? 'Anda tidak memiliki hak akses untuk halaman ini.' : (${s >= 500} ? 'Maaf, terjadi kesalahan di server. Silakan coba lagi.' : 'Periksa kembali data yang dikirim.'))">Pesan</p>
        <div class="actions" style="justify-content:center">
            <a class="btn light" th:href="@{/}" data-kembali><svg class="i"><use href="#i-left"/></svg>Kembali</a>
            <a class="btn" th:href="@{/}">Ke beranda</a>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
</body>
</html>

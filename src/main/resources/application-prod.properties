# Profil produksi (Render + TiDB Cloud). Aktif bila SPRING_PROFILES_ACTIVE=prod.
# Semua rahasia diambil dari environment variable; tidak ada nilai bawaan untuk password.

# ---------- database: TiDB Cloud Starter (kompatibel MySQL, wajib TLS, port 4000) ----------
# sessionVariables time_zone +07:00 (WIB, tanpa DST): CURRENT_TIMESTAMP di database ikut WIB seperti MySQL lokal,
# tanpa bergantung pada tabel zona waktu server (server TiDB memakai UTC).
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:4000}/${DB_NAME:jantungku}?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3&createDatabaseIfNotExist=true&connectionTimeZone=Asia/Jakarta&sessionVariables=time_zone='%2B07:00'&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# instance gratis: cukup sedikit koneksi agar hemat memori
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# koneksi diputus TiDB setelah menganggur; segarkan sebelum itu
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=60000

# ---------- akun awal: WAJIB diisi (aplikasi gagal start bila kosong, jadi admin123 tidak pernah dipakai) ----------
app.admin.password=${ADMIN_PASSWORD}
app.pakar.password=${PAKAR_PASSWORD}

# ---------- di belakang proxy HTTPS Render ----------
# agar redirect, tautan, dan cookie memakai https (bukan http internal)
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml

# ---------- kinerja ----------
spring.thymeleaf.cache=true
# aset sudah diberi ?v=... sehingga aman di-cache lama
spring.web.resources.cache.period=7d

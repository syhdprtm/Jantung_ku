spring.application.name=sistem-pakar-jantung
server.port=${PORT:8090}
server.servlet.session.timeout=8h

# ---------- MySQL (default Laragon: root tanpa password) ----------
# Database dibuat otomatis bila belum ada.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sistem_pakar_jantung}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Struktur tabel dikelola Flyway: src/main/resources/db/migration/V*.sql
# baseline-on-migrate: database lama (sebelum Flyway) dianggap sudah berada di V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Sesi login disimpan di MySQL (tabel SPRING_SESSION dibuat oleh migrasi V6)
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.cleanup-cron=0 */15 * * * *

# Unggah dataset evaluasi (CSV)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Akun admin awal (dibuat sekali saat tabel users masih kosong)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
# Akun pakar awal (dibuat bila belum ada pengguna ber-role PAKAR)
app.pakar.username=${PAKAR_USERNAME:pakar}
app.pakar.password=${PAKAR_PASSWORD:pakar123}

# Render halaman sampai selesai sebelum dikirim. Tanpa ini, halaman besar sudah terkirim
# sebelum token CSRF (dan sesi) dibuat sehingga cookie sesi tidak sempat dipasang.
spring.thymeleaf.servlet.produce-partial-output-while-processing=false
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

# Render Blueprint: membuat web service Jantungku (paket Free) dari repo GitHub ini.
# Nilai bertanda sync: false diisi sendiri di dashboard Render (tidak disimpan di repo).
services:
  - type: web
    name: jantungku
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: jantungku
      - key: DB_HOST
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAKAR_PASSWORD
        sync: false
